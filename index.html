<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two and a half men</title>
    <style>
        /* Remove default margins and prevent scrolling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            background: #000;
        }

        .video-container {
            position: relative;
            width: 100vw;   /* 100% of Viewport Width */
            height: 100vh;  /* 100% of Viewport Height */
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://vidsrc-embed.ru/embed/tv?imdb=tt0369179" 
            referrerpolicy="origin" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
