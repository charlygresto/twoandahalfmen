<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Two and a half men</title>
    <style>
        /* Force the body to be exactly the size of the window */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: fixed; /* Fixed stays put even if the page tries to scroll */
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Support for modern mobile browsers */
            height: 100dvh; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            src="https://streamimdb.ru/embed/tv/tt0369179" 
            referrerpolicy="origin" 
            allow="autoplay; fullscreen"
            sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin allow-presentation"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
